<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#f5f0e6; --card:#fbf9f4; --ink:#3d3a35; --muted:#8a857c; --line:#e7e1d5;
  --accent:#3a6f9a; --accent-soft:#dce8f2; --emilie:#c4577f; --emilie-soft:#f6e1e9;
  --leon:#3a6f9a; --leon-soft:#dce8f2; --bar:#cfc9bd; --warn-bg:#f8ecd3; --warn:#8a5a0b;
  --extra:#c46a2b; --extra-soft:#f8e3d3; --forbrug:#5d8a5a; --bolig:#8a7a5c;
  --shadow:0 6px 18px rgba(80,70,50,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 16px 110px}
header.hero{background:var(--accent);color:#fff;margin:0 -16px;padding:28px 20px 70px;border-bottom-right-radius:60% 40px}
.hero small{opacity:.8;font-size:14px}
.hero h1{margin:2px 0 0;font-size:30px;font-weight:700}
.hero .who{float:right;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.card{background:var(--card);border-radius:22px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.overlap{margin-top:-50px}
.label{font-size:13px;color:var(--muted);margin:0}
.big{font-size:30px;font-weight:700;margin:2px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:40px}
.bars button{position:relative;flex:1;border:0;padding:0;border-radius:6px;background:var(--bar);cursor:pointer;transition:background .15s}
.bars button:hover{background:#b9b2a4}
.bars button.sel{background:var(--accent)}
.bars button.miss{background:repeating-linear-gradient(135deg,var(--bar) 0 5px,#e2ddd2 5px 10px)}
.bars button.miss.sel{background:repeating-linear-gradient(135deg,var(--accent) 0 5px,#6f98bb 5px 10px)}
.bars button.trial:not(.sel){background:#e2ddd2;outline:1.5px dashed var(--bar);outline-offset:-1.5px}
.bars button.off{background:var(--line);cursor:default}
.bars .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;line-height:1.3;padding:5px 9px;border-radius:8px;white-space:nowrap;text-align:center;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2}
.bars .tip b{display:block;font-weight:600}
.bars .tip small{font-size:11px;opacity:.8}
.bars button:first-child .tip,.bars button:nth-child(2) .tip{left:0;transform:none}
.bars button:last-child .tip,.bars button:nth-last-child(2) .tip{left:auto;right:0;transform:none}
.bars button:hover .tip,.bars button:focus-visible .tip{opacity:1}
.await{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.35;cursor:pointer}
.await i{font-size:20px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.tile{cursor:pointer;margin:0}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:0 0 auto}
.tile h3{margin:12px 0 0;font-size:18px}
.tile .amt{font-size:15px;font-weight:600;margin-top:6px;white-space:nowrap}
.wide{grid-column:span 2;display:flex;align-items:center;gap:14px}
.wide>i{font-size:26px;color:var(--muted)}
.section-title{font-size:13px;color:var(--muted);margin:8px 4px 10px;text-transform:uppercase;letter-spacing:.06em}
.extra-tile{border:2px dashed #e7c7ae;background:#fdf6f0;box-shadow:none;display:flex;align-items:center;gap:14px;cursor:pointer}
.extra-tile .ic-wrap{width:44px;height:44px;border-radius:14px;background:var(--extra-soft);color:var(--extra);display:flex;align-items:center;justify-content:center;font-size:22px}
.list .item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.list .item:first-of-type{border-top:0}
.list .item.dim{opacity:.45;cursor:default}
.item i.ic{font-size:20px;color:var(--muted);width:24px;text-align:center}
.item .nm{flex:1;font-size:15px;min-width:0}
.item .sub{font-size:12px;color:var(--muted)}
.item .v{font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.back{display:flex;align-items:center;gap:12px;padding:22px 0 14px}
.back button{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;font-size:20px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
.back h2{margin:0;font-size:24px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:13px;background:var(--bg);padding:6px 12px;border-radius:99px}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav button{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:16px}
.monthnav button:disabled{opacity:.3;cursor:default}
.add{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--accent);font-weight:600;background:none;border:2px dashed var(--line);border-radius:18px;padding:14px;width:100%;font-size:15px;cursor:pointer;margin-bottom:16px}
.years{display:flex;gap:8px;margin-bottom:16px}
.years button{border:0;background:var(--card);padding:8px 16px;border-radius:99px;font-size:14px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
.years button.on{background:var(--accent);color:#fff}
.wrap{background:var(--accent);color:#fff}
.wrap .label{color:rgba(255,255,255,.75)}
.wrap .stats{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-top:18px}
.wrap .stats b{display:block;font-size:18px}
.wrap .stats span{font-size:12px;color:rgba(255,255,255,.75)}
.cmp .item{cursor:default}
.up{color:#b3402f}.down{color:#3f7a3a}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top-left-radius:28px;border-top-right-radius:28px;box-shadow:0 -4px 20px rgba(80,70,50,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
nav.bottom .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:16px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--bar);background:none;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;cursor:pointer;padding:0}
.chk.e{background:var(--emilie);border-color:var(--emilie)}
.chk.l{background:var(--leon);border-color:var(--leon)}
.chk:disabled{border-style:dashed;cursor:default}
.item.done .nm>span:first-child{text-decoration:line-through;text-decoration-color:var(--bar)}
.who-e{color:var(--emilie)}.who-l{color:var(--leon)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;margin-top:6px;padding:7px 10px;border-radius:10px}
.note.e{background:var(--emilie-soft)}.note.l{background:var(--leon-soft)}
.note b{font-weight:600}.note.e b{color:var(--emilie)}.note.l b{color:var(--leon)}
.note .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px;font-size:16px;border-radius:8px;flex:0 0 auto}
.note .x.armed,.btn.del.armed{background:#b3402f;color:#fff;font-size:13px;font-weight:600}
.btn.del.armed{padding:14px 14px}
.noteicon{font-size:15px;color:var(--muted);margin-left:4px;vertical-align:-2px}
.daytag{display:inline-flex;align-items:center;gap:3px;background:#fde8e8;color:#e05a68;border-radius:99px;padding:1px 7px 1px 5px;font-size:11px;font-weight:600;margin-right:4px;vertical-align:1px;white-space:nowrap}
.daytag i{font-size:12px}
.xfer{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.xfer:first-of-type{margin-top:8px}
.xfer b{font-size:15px}
.xfer .sub{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.xamt{font-size:20px;font-weight:700;white-space:nowrap}
.adjlist{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.adj{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;cursor:pointer}
.adj i{font-size:20px}
.adj .sub{font-size:12px;color:var(--muted)}
.adjbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:8px 0;cursor:pointer;display:flex;align-items:center;gap:6px}
.progress{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:12px 0 8px}
textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit;resize:vertical;min-height:70px}
nav.bottom button i{font-size:24px}
nav.bottom button.on{color:#fff;background:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(40,35,25,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-top-left-radius:26px;border-top-right-radius:26px;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,select{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid div span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.mgrid input{padding:8px 10px;font-size:15px}
.mgrid input:disabled{background:var(--bg)}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:var(--bg);color:var(--ink)}
.btn.del{background:none;color:#b3402f;flex:0 0 auto;padding:14px 8px}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.inline button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:0 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.err{color:#b3402f;display:none}
.log .item{cursor:default;align-items:flex-start}
.empty{color:var(--muted);text-align:center;padding:20px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.hero .who.armed{background:#b3402f}
body.locked nav.bottom,body.locked .app{display:none}
.gate{position:fixed;inset:0;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;z-index:30;padding:24px}
.gate-in{text-align:center;max-width:340px}
.gate h1{font-size:32px;margin:14px 0 4px}
.gate h2{margin:12px 0 6px}
.gate p{opacity:.85;line-height:1.5;margin:0 0 24px}
.glogo{width:76px;height:76px;border-radius:24px;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:40px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border:0;border-radius:99px;padding:14px 22px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="app" id="view"></div>

<nav class="bottom"><div class="in">
  <button data-go="home"><i class="ti ti-layout-dashboard"></i>Overblik</button>
  <button data-go="items"><i class="ti ti-list-details"></i>Poster</button>
  <button data-go="check"><i class="ti ti-checklist"></i>Tjekliste</button>
  <button data-go="year"><i class="ti ti-chart-bar"></i>År</button>
  <button data-go="log"><i class="ti ti-history"></i>Ændringer</button>
</div></nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<div class="gate" id="gate"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, writeBatch, getDoc, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

/* Kun disse to Google-konti har adgang (samme liste står i firestore.rules) */
const USERS={'emilie.asferg@hotmail.dk':'Emilie','leonbnnb9940@gmail.com':'Leon'};

const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
const db=initializeFirestore(fbApp,{ignoreUndefinedProperties:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const MONTHS=['Januar','Februar','Marts','April','Maj','Juni','Juli','August','September','Oktober','November','December'];
const M3=MONTHS.map(m=>m.slice(0,3).toLowerCase());
const all=v=>Array(12).fill(v);
const only=(map,fill=0)=>{const a=all(fill);for(const k in map)a[k]=map[k];return a;};

/* Budgettet startede 15. september 2026. September-november 2026 var en prøveperiode:
   udgifterne er rigtige, men overførslerne fulgte ikke budgettet. Det rigtige budget gælder fra december 2026. */
const START={y:2026,m:8};
const TRIAL_END={y:2026,m:10};
const idx=(Y,m)=>Y*12+m;
const START_IDX=idx(START.y,START.m);
const NOW=new Date(),CUR_Y=NOW.getFullYear(),CUR_M=NOW.getMonth(),CUR_IDX=idx(CUR_Y,CUR_M);
const active=(Y,m)=>idx(Y,m)>=START_IDX;
const isTrial=(Y,m)=>active(Y,m)&&idx(Y,m)<=idx(TRIAL_END.y,TRIAL_END.m);
const TRIAL_PILL='<span class="pill" style="background:var(--line);color:var(--muted)" title="Udgifterne er rigtige, men overførslerne fulgte ikke budgettet">Prøveperiode · ca. tal</span>';
/* En måned regnes som overført, når overførselsdagen (sidste bankdag måneden før) er nået */
const realized=(Y,m)=>active(Y,m)&&idx(Y,m)<=realMax();
function realMax(){const t=new Date();t.setHours(0,0,0,0);return t>=lastBankDate(CUR_Y,CUR_M)?CUR_IDX+1:CUR_IDX;}
const fromIdx=i=>({Y:Math.floor(i/12),m:i%12});
const MAX_IDX=idx(CUR_Y+1,11);

const GROUPS={
  emilie:{name:'Emilie',initial:'E',color:'var(--emilie)',soft:'var(--emilie-soft)'},
  leon:{name:'Leon',initial:'L',color:'var(--leon)',soft:'var(--leon-soft)'},
  bolig:{name:'Bolig',icon:'ti-home',shared:true},
  forbrug:{name:'Forbrug',icon:'ti-bolt',shared:true,variable:true}
};

/* Faste beløb fra fanen "Fælleskonto" i budgetskema_Sparkrondk.xlsx (2026) */
const SEED=[
  {g:'emilie',name:'Ulykkesforsikring',icon:'ti-shield',a:all(59)},
  {g:'emilie',name:'HK (lønsikring, a-kasse mm)',icon:'ti-briefcase',a:all(1176)},
  {g:'emilie',name:'Kritisk liv og sygdom',icon:'ti-heartbeat',a:all(324.75)},
  {g:'emilie',name:'Bilforsikring',icon:'ti-car',a:all(418)},
  {g:'leon',name:'Jagttegn + andet jagt',icon:'ti-trees',a:only({2:680,3:450})},
  {g:'leon',name:'Sygeforsikring Danmark',icon:'ti-first-aid-kit',a:all(100)},
  {g:'leon',name:'Fagforening + a-kasse',icon:'ti-briefcase',a:all(1093)},
  {g:'leon',name:'Billån',icon:'ti-car',a:all(2850)},
  {g:'leon',name:'Bilforsikring',icon:'ti-car-crash',a:all(201)},
  {g:'leon',name:'Kritisk liv og sygdom',icon:'ti-heartbeat',a:all(293.31)},
  {g:'bolig',name:'Kreditforening',icon:'ti-building-bank',a:only({1:4962,4:4962,7:4962,10:4962})},
  {g:'bolig',name:'Boliglån',icon:'ti-home-dollar',a:all(1200)},
  {g:'bolig',name:'Indboforsikring',icon:'ti-sofa',a:all(0)},
  {g:'bolig',name:'Ejendomsforsikring',icon:'ti-shield-check',a:all(1297.96)},
  {g:'bolig',name:'Internet',icon:'ti-wifi',a:all(375)},
  /* Forbrug: beløb = betalte regninger i overførselsmåneden. cov = hvilken måned regningen dækker (absolut månedsindeks) */
  {g:'forbrug',name:'El og gas',icon:'ti-bolt',v:true,a:only({8:0,9:1081.90},null),cov:only({8:idx(2026,7),9:idx(2026,8)},null)},
  {g:'forbrug',name:'Forsyning (vand og skrald)',icon:'ti-droplet',v:true,a:only({8:0,9:248.37,10:460.12},null),cov:only({8:idx(2026,7),9:idx(2026,8),10:idx(2026,9)},null)}
];
const SEED_EXTRAS=[
  {name:'Syn af brændeovn',icon:'ti-flame',amount:2473.75,y:2026,m:9},
  {name:'Træpiller',icon:'ti-wood',amount:7000,y:2026,m:9}
];

function fresh(){
  return{
    me:'',
    items:SEED.map((x,i)=>({id:'i'+i,g:x.g,name:x.name,icon:x.icon,v:!!x.v,years:{[START.y]:[...x.a]},cover:x.v?{[START.y]:[...x.cov]}:undefined,by:null,at:null})),
    extras:SEED_EXTRAS.map((e,i)=>({id:'e'+i,...e,by:null,at:null})),
    log:[],
    checks:{},   /* {"2026-10": {rowKey: {by, at}}} */
    notes:[]     /* [{id, month:"2026-10", row:rowKey|null, text, by, at}] */
  };
}
/* ---------- Firestore-synkronisering ----------
   Hver post, uforudset udgift, note, logpost og hver måneds flueben er sit eget dokument.
   save() sammenligner med det, der sidst blev synkroniseret, og skriver kun det, der er ændret.
   Så kan Emilie og Leon rette forskellige ting samtidig uden at overskrive hinanden. */
let state={me:'',items:[],extras:[],log:[],checks:{},notes:[],adjust:[]};
const COLS={
  items:{get:()=>state.items,arr:true},
  adjust:{get:()=>state.adjust,arr:true},  /* omregning: {y,m,text,amount,kind:'extra'|'short',split:'both'|'emilie'|'leon',by,at} */
  extras:{get:()=>state.extras,arr:true},
  notes:{get:()=>state.notes,arr:true},
  log:{get:()=>state.log,arr:true},
  checks:{get:()=>Object.entries(state.checks).map(([id,v])=>({id,v})),arr:false}
};
const synced={items:new Map(),extras:new Map(),notes:new Map(),log:new Map(),checks:new Map(),adjust:new Map()};
const strip=o=>JSON.parse(JSON.stringify(o));
const docData=(c,o)=>{if(c==='checks')return {v:strip(o.v)};const {id,...rest}=o;return strip(rest);};
let saving=Promise.resolve();
function save(){
  const batch=writeBatch(db);let n=0;
  for(const c in COLS){
    const cur=new Map(COLS[c].get().map(o=>[o.id,JSON.stringify(docData(c,o))]));
    for(const [id,js] of cur)if(synced[c].get(id)!==js){batch.set(doc(db,c,id),JSON.parse(js));synced[c].set(id,js);n++;}
    if(c==='log')continue; /* loggen trimmes lokalt, men slettes ikke i databasen */
    for(const id of [...synced[c].keys()])if(!cur.has(id)){batch.delete(doc(db,c,id));synced[c].delete(id);n++;}
  }
  if(n)saving=batch.commit().catch(e=>{console.error(e);toast('Kunne ikke gemme. Tjek forbindelsen.');});
}
function applySnap(c,snap){
  let remote=[];
  snap.docChanges().forEach(ch=>{
    const id=ch.doc.id;
    if(ch.type==='removed'){synced[c].delete(id);return;}
    const d=ch.doc.data();synced[c].set(id,JSON.stringify(d));
    if(c==='log'&&ch.type==='added'&&!snap.metadata.hasPendingWrites&&booted&&d.who!==state.me)remote.push(d);
  });
  if(c==='checks'){state.checks={};snap.docs.forEach(d=>state.checks[d.id]=d.data().v||{});}
  else{
    state[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(c==='log'||c==='notes')state[c].sort((a,b)=>a.at-b.at);
    else state[c].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  }
  if(remote.length)toast(`${remote[remote.length-1].who}: ${remote[remote.length-1].text}`,3500);
}
let booted=false,unsubs=[];
async function startSync(){
  /* Første gang: læg startdata (fra Excel) i databasen */
  const meta=await getDoc(doc(db,'meta','app'));
  if(!meta.exists()){
    const f=fresh(),batch=writeBatch(db);
    f.items.forEach(x=>{const {id,...r}=x;batch.set(doc(db,'items',id),strip(r));});
    f.extras.forEach(x=>{const {id,...r}=x;batch.set(doc(db,'extras',id),strip(r));});
    batch.set(doc(db,'meta','app'),{seededAt:Date.now(),seededBy:state.me});
    await batch.commit();
  }
  const ready=new Set();
  const done=c=>{ready.add(c);if(ready.size===6&&!booted){booted=true;showApp();}else if(booted)renderKeep();};
  for(const c of ['items','extras','notes','checks','adjust']){
    unsubs.push(onSnapshot(collection(db,c),{includeMetadataChanges:false},s=>{applySnap(c,s);done(c);},err));
  }
  unsubs.push(onSnapshot(query(collection(db,'log'),orderBy('at','desc'),limit(300)),s=>{applySnap('log',s);done('log');},err));
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e));
let sel=Math.max(START_IDX,Math.min(CUR_IDX+1,MAX_IDX)); /* forsiden viser den måned, næste overførsel er til */
let yearView=CUR_Y;
const selY=()=>fromIdx(sel).Y, selM=()=>fromIdx(sel).m;

/* ---------- calculations ---------- */
const kr=v=>new Intl.NumberFormat('da-DK',{maximumFractionDigits:0}).format(Math.round(v))+' kr.';
const kr2=v=>new Intl.NumberFormat('da-DK',{minimumFractionDigits:Math.round(v*100)%100?2:0,maximumFractionDigits:2}).format(v)+' kr.';
const halfSub=a=>(+a>0)?`<div class="sub" style="font-weight:400">${kr2(+a/2)} hver</div>`:'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=v=>v!=null&&v!=='';
const items=g=>state.items.filter(x=>x.g===g);

function fixedArr(x,Y){
  const ys=Object.keys(x.years).map(Number).sort((a,b)=>a-b);
  let best=ys[0];for(const y of ys)if(y<=Y)best=y;
  return x.years[best];
}
function val(x,Y,m){
  if(!active(Y,m))return x.v?null:0;
  if(x.v)return x.years[Y]?.[m]??null;
  return +fixedArr(x,Y)[m]||0;
}
const sumG=(g,Y,m)=>items(g).reduce((s,x)=>s+(+val(x,Y,m)||0),0);
const extrasOf=(Y,m)=>state.extras.filter(e=>e.y===Y&&e.m===m);
const exSum=(Y,m)=>active(Y,m)?extrasOf(Y,m).reduce((s,e)=>s+(+e.amount||0),0):0;
const sharedSum=(Y,m)=>sumG('bolig',Y,m)+sumG('forbrug',Y,m)+exSum(Y,m);
const pays=(p,Y,m)=>sumG(p,Y,m)+sharedSum(Y,m)/2;
const total=(Y,m)=>pays('emilie',Y,m)+pays('leon',Y,m);
/* Omregning: penge der allerede står på (eller mangler på) kontoen. Påvirker kun hvad der skal OVERFØRES, ikke udgifterne. */
const adjOf=(Y,m)=>(state.adjust||[]).filter(a=>a.y===Y&&a.m===m);
const credit=(p,Y,m)=>adjOf(Y,m).reduce((s,a)=>{const v=(+a.amount||0)*(a.kind==='short'?-1:1);return s+(a.split==='both'?v/2:a.split===p?v:0);},0);
const xfer=(p,Y,m)=>pays(p,Y,m)-credit(p,Y,m);
const xferTotal=(Y,m)=>xfer('emilie',Y,m)+xfer('leon',Y,m);
const missing=(Y,m)=>active(Y,m)&&!isTrial(Y,m)&&idx(Y,m)<=CUR_IDX+1?items('forbrug').filter(x=>val(x,Y,m)==null):[];
const irregular=a=>new Set(a.map(Number)).size>1;
const monthsOf=(Y,f)=>MONTHS.map((_,m)=>m).filter(m=>f(Y,m));
/* Måneder i det rigtige budget (uden prøveperioden). Bruges til at se om en post betales hver måned. */
const budgetMonths=Y=>{const ms=monthsOf(Y,(y,m)=>active(y,m)&&!isTrial(y,m));return ms.length?ms:monthsOf(Y,active);};
/* "Af og til"-post: betales ikke i alle budgetmåneder i året (fx jagttegn) */
const occasional=(x,Y)=>!x.v&&budgetMonths(Y).some(m=>!(+val(x,Y,m)));
const sumOver=(Y,ms,f)=>ms.reduce((s,m)=>s+f(Y,m),0);

/* Trækdag: fast dato (1-31) eller 'last' = sidste bankdag */
const dayTxt=x=>x.day==='last'?'sidste bankdag':x.day?`d. ${x.day}.`:'';
const dayNum=x=>x.day==='last'?31.5:x.day?+x.day:99;
const dayPrefix=x=>x.day?`<span class="daytag"><i class="ti ti-calendar-event"></i>${dayTxt(x)}</span> `:'';
const daySelect=(id,cur)=>`<select id="${id}"><option value="">Ingen fast dato</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${+cur===i+1?'selected':''}>d. ${i+1}.</option>`).join('')}<option value="last" ${cur==='last'?'selected':''}>Sidste bankdag</option></select>`;
const readDay=v=>v==='last'?'last':v?+v:null;
function freqText(x,Y){

}
/* Danske bankdage: weekender og bankernes lukkedage (helligdage, 24.-26./31. dec., 1. jan., 5. juni) */
function easter(Y){const a=Y%19,b=Math.floor(Y/100),c=Y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(Y,mo-1,da);}
function isBankDay(d){
  if(d.getDay()===0||d.getDay()===6)return false;
  const md=(d.getMonth()+1)+'-'+d.getDate();
  if(['1-1','6-5','12-24','12-25','12-26','12-31'].includes(md))return false;
  const e=easter(d.getFullYear()),diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-e)/864e5);
  return ![-3,-2,1,39,40,50].includes(diff); /* skærtors., langfre., 2. påskedag, Kr. himmelfart (+dagen efter), 2. pinsedag */
}
function lastBankDate(Y,m){const d=new Date(Y,m+1,0);while(!isBankDay(d))d.setDate(d.getDate()-1);return d;}
function lastWorkday(Y,m){
  const d=lastBankDate(Y,m);

}
/* En måned = de udgifter, der trækkes i måneden. Pengene overføres sidste bankdag i måneden før. */
const transferDay=(Y,m)=>{const p=idx(Y,m)-1;return lastWorkday(Math.floor(p/12),p%12);};
const forMonth=(Y,m)=>MONTHS[(m+1)%12].toLowerCase()+(m===11?' '+(Y+1):'');
const mName=(Y,m)=>MONTHS[m].toLowerCase()+(Y!==CUR_Y?' '+Y:'');
const idxName=i=>{const {Y,m}=fromIdx(i);return mName(Y,m);};
function when(ts){const d=new Date(ts);return d.getDate()+'. '+M3[d.getMonth()]+' kl. '+String(d.getHours()).padStart(2,'0')+'.'+String(d.getMinutes()).padStart(2,'0');}
function yearsAvail(){const s=new Set([START.y,CUR_Y]);state.extras.forEach(e=>s.add(e.y));state.items.forEach(x=>Object.keys(x.years).forEach(y=>s.add(+y)));return [...s].filter(y=>y>=START.y&&y<=CUR_Y+1).sort();}

    ?`<i class="ti ${G.icon}" style="font-size:26px;color:var(--muted)"></i>`
    :`<div class="avatar" style="background:${G.soft};color:${G.color}">${G.initial}</div>`;

  }else if(G.shared){
    summary=`<p class="label">Bolig i ${mName(Y,m)}</p><p class="big">${kr(sumG('bolig',Y,m))}</p>
       <div class="chips"><span class="chip">Emilie ${kr(sumG('bolig',Y,m)/2)}</span><span class="chip">Leon ${kr(sumG('bolig',Y,m)/2)}</span></div>`;
  }else{
    const rm=monthsOf(Y,realized);

       <div class="chips"><span class="chip">Egne ${kr(sumG(g,Y,m))}</span><span class="chip">½ bolig ${kr(sumG('bolig',Y,m)/2)}</span><span class="chip">½ forbrug ${kr(sumG('forbrug',Y,m)/2)}</span>${exSum(Y,m)?`<span class="chip">½ uforudset ${kr(exSum(Y,m)/2)}</span>`:''}</div>
       <p class="label" style="margin-top:12px">${kr(sumOver(Y,rm,(y,i)=>pays(g,y,i)))} indsat i ${Y} indtil nu</p>`;

  return `
  <div class="back"><button data-back aria-label="Tilbage"><i class="ti ti-arrow-left"></i></button>${head}<h2>${G.name}</h2></div>

}

function history(g){
  const rows=[];
  state.items.filter(x=>x.g===g).forEach(x=>Object.entries(x.years).forEach(([Y,a])=>a.forEach((v,m)=>{if(has(v))rows.push({x,Y:+Y,m,v});})));
  rows.sort((a,b)=>idx(b.Y,b.m)-idx(a.Y,a.m));
  const avg=items(g).map(x=>{const v=rows.filter(r=>r.x===x).map(r=>+r.v);return v.length?`${esc(x.name)}: snit ${kr(v.reduce((s,n)=>s+n,0)/v.length)}`:null;}).filter(Boolean);
  return `<div class="card list">
    <p class="label" style="margin-bottom:6px">Betalte regninger</p>
    ${rows.length?rows.map(({x,Y,m,v})=>`<div class="item" data-bill="${x.id}" data-by="${Y}" data-bm="${m}">
      <i class="ti ${x.icon} ic"></i>
      <div class="nm">${esc(x.name)}<div class="sub">${idxName(x.cover?.[Y]?.[m]??idx(Y,m)-1)}-regning · trukket i ${mName(Y,m)}</div></div>
      <div class="v">${kr2(+v)}${halfSub(v)}</div></div>`).join('')
    :'<p class="empty">Når I taster regninger ind, kan I se dem her</p>'}
    ${avg.length?`<p class="label" style="margin-top:10px">${avg.join(' · ')}</p>`:''}
  </div>`;
}

/* ---------- year / wrap ---------- */
function catSums(Y,ms){
  return {
    egne:sumOver(Y,ms,(y,m)=>sumG('emilie',y,m)+sumG('leon',y,m)),
    bolig:sumOver(Y,ms,(y,m)=>sumG('bolig',y,m)),
    forbrug:sumOver(Y,ms,(y,m)=>sumG('forbrug',y,m)),
    ekstra:sumOver(Y,ms,exSum)
  };
}
const CATS=[['egne','Emilie og Leons egne','var(--accent)'],['bolig','Bolig','var(--bolig)'],['forbrug','Forbrug','var(--forbrug)'],['ekstra','Uforudsete','var(--extra)']];
const span=ms=>ms.length?(ms.length===1?M3[ms[0]]:`${M3[ms[0]]}–${M3[ms[ms.length-1]]}`):'';

function yearPage(){
  const Y=yearView,ms=monthsOf(Y,realized);
  const tot=sumOver(Y,ms,total);
  const top=ms.length?ms.reduce((a,b)=>total(Y,b)>total(Y,a)?b:a):null;
  const c=catSums(Y,ms),ctot=Object.values(c).reduce((s,v)=>s+v,0)||1;
  const P=Y-1,overlap=MONTHS.map((_,m)=>m).filter(m=>realized(Y,m)&&active(P,m));
  let cmp;
  if(overlap.length){
    const a=catSums(P,overlap),b=catSums(Y,overlap);
    const ta=sumOver(P,overlap,total),tb=sumOver(Y,overlap,total);
    const rowC=(lbl,x,y)=>{const d=x?((y-x)/x*100):null;return `<div class="item"><div class="nm">${lbl}<div class="sub">${P}: ${kr(x)} · ${Y}: ${kr(y)}</div></div><div class="v ${y>x?'up':'down'}">${d==null?'ny':(d>0?'+':'')+Math.round(d)+' %'}</div></div>`;};
    cmp=`<div class="card list cmp"><p class="label" style="margin-bottom:6px">${Y} mod ${P} · samme måneder (${span(overlap)})</p>
      ${rowC('<b>I alt overført</b>',ta,tb)}${CATS.map(([k,l])=>rowC(l,a[k],b[k])).join('')}</div>`;
  }else{
    const first=Math.max(START_IDX+12,idx(Y,0));const f=fromIdx(first);
    cmp=`<div class="card"><p class="label" style="margin-bottom:6px">Sammenligning med året før</p>
      <p style="margin:0;font-size:14px;line-height:1.5">Budgettet startede i ${MONTHS[START.m].toLowerCase()} ${START.y}, så der er ikke noget at sammenligne ${Y} med endnu. Fra ${MONTHS[f.m].toLowerCase()} ${f.Y} kan I se, om I bruger mere eller mindre end samme måned året før.</p></div>`;
  }
  return `<div class="back"><h2>Årsoverblik</h2></div>
  <div class="years">${yearsAvail().map(y=>`<button data-year="${y}" class="${y===Y?'on':''}">${y}</button>`).join('')}</div>
  <div class="card wrap">
    <p class="label">Jeres ${Y}${ms.length?` · ${span(ms)}`:''}${ms.some(m=>isTrial(Y,m))?' · inkl. prøveperiode (sep.–nov., ca. tal)':''}</p>
    <p class="big">${kr(tot)}</p>
    <p class="label">overført til fælleskontoen${Y===START.y?' siden budgettet startede':''}</p>
    <div class="stats">
      <div><b>${ms.length?kr(tot/ms.length):'–'}</b><span>snit pr. måned</span></div>
      <div><b>${top!=null?MONTHS[top]:'–'}</b><span>dyreste måned${top!=null?' · '+kr(total(Y,top)):''}</span></div>
      <div><b>${kr(c.forbrug)}</b><span>el, vand og skrald</span></div>
      <div><b>${kr(c.ekstra)}</b><span>uforudsete udgifter</span></div>
      <div><b>${kr(sumOver(Y,ms,(y,m)=>pays('emilie',y,m)))}</b><span>indsat af Emilie</span></div>
      <div><b>${kr(sumOver(Y,ms,(y,m)=>pays('leon',y,m)))}</b><span>indsat af Leon</span></div>
    </div>
  </div>
  <div class="card">
    <p class="label">Hvor gik pengene hen?</p>
    <div class="split">${CATS.map(([k,,col])=>`<div style="width:${c[k]/ctot*100}%;background:${col}"></div>`).join('')}</div>
    ${CATS.map(([k,l,col])=>`<div class="row" style="font-size:14px;padding:3px 0"><span><span class="dot" style="background:${col}"></span>${l}</span><span>${kr(c[k])} · ${Math.round(c[k]/ctot*100)} %</span></div>`).join('')}
  </div>
  ${cmp}
  <div class="card list">
    <p class="label" style="margin-bottom:6px">Måned for måned</p>
    ${MONTHS.map((n,m)=>active(Y,m)?`<div class="item" data-pick="${idx(Y,m)}">
      <i class="ti ti-calendar ic"></i>
      <div class="nm">${n}<div class="sub">Emilie ${kr(pays('emilie',Y,m))} · Leon ${kr(pays('leon',Y,m))}${missing(Y,m).length?'<br><span style="color:var(--warn)">Forbrug mangler</span>':''}${!realized(Y,m)?'<br>Forventet':''}${isTrial(Y,m)?'<br>Prøveperiode · overførslerne fulgte ikke budgettet':''}</div></div>
      <div class="v">${kr(total(Y,m))}</div></div>`
      :`<div class="item dim"><i class="ti ti-calendar-off ic"></i><div class="nm">${n}<div class="sub">Før budgettets start</div></div></div>`).join('')}
  </div>`;
}

/* ---------- tjekliste ---------- */
const mKey=(Y,m)=>`${Y}-${m+1}`;
const pCls=who=>who==='Leon'?'l':'e';
const shortDate=ts=>{const d=new Date(ts);return d.getDate()+'. '+M3[d.getMonth()];};
function rowsFor(Y,m){
  const secs=[];
  for(const g of ['emilie','leon','bolig']){
    const rows=items(g).map(x=>({key:x.id,name:x.name,icon:x.icon,amt:val(x,Y,m),x})).filter(r=>r.amt>0).sort((a,b)=>dayNum(a.x)-dayNum(b.x));
    if(rows.length)secs.push({title:GROUPS[g].name,g,rows});
  }
  const fr=items('forbrug').map(x=>{const v=val(x,Y,m);return {key:x.id,name:x.name,icon:x.icon,amt:has(v)?+v:null,pending:!has(v),x};}).filter(r=>r.pending||r.amt>0).sort((a,b)=>dayNum(a.x)-dayNum(b.x));
  if(fr.length)secs.push({title:'Forbrug',g:'forbrug',rows:fr});
  const ex=extrasOf(Y,m).map(e=>({key:'x:'+e.id,name:e.name,icon:e.icon||'ti-tool',amt:+e.amount}));
  if(ex.length)secs.push({title:'Uforudsete',g:'ekstra',rows:ex});
  return secs;
}
function payStatus(Y,m){
  const ch=state.checks[mKey(Y,m)]||{};
  let tot=0,e=0,l=0,n=0,done=0;
  /* Beløbet fordeles efter hvem posten tilhører – ikke hvem der satte fluebenet. Fælles poster deles 50/50. */
  rowsFor(Y,m).forEach(s=>s.rows.forEach(r=>{if(r.pending)return;n++;tot+=r.amt;const c=ch[r.key];if(c){done++;
    if(s.g==='emilie')e+=r.amt;else if(s.g==='leon')l+=r.amt;else{e+=r.amt/2;l+=r.amt/2;}}}));
  return {tot,e,l,n,done};
}
const notesFor=(Y,m,row)=>state.notes.filter(n=>n.month===mKey(Y,m)&&(n.row??null)===row);
const noteHtml=n=>`<div class="note ${pCls(n.by)}"><div><b>${esc(n.by)}</b> ${esc(n.text)}<div class="sub">${shortDate(n.at)}</div></div><button class="x" data-delnote="${n.id}" aria-label="Slet note"><i class="ti ti-x"></i></button></div>`;

function checkView(){
  const Y=selY(),m=selM();

  const k=mKey(Y,m),ch=state.checks[k]||{},st=payStatus(Y,m);
  const pct=v=>st.tot?v/st.tot*100:0;
  const bo=sumG('bolig',Y,m)/2,fo=sumG('forbrug',Y,m)/2,ex=exSum(Y,m)/2,miss=missing(Y,m).map(x=>x.name);
  const xferRow=p=>{const G=GROUPS[p];return `<div class="xfer">
      <div class="avatar" style="width:36px;height:36px;font-size:14px;background:${G.soft};color:${G.color}">${G.initial}</div>

        <div class="sub">${[['Egne',sumG(p,Y,m)],['½ bolig',bo],['½ forbrug',fo],['½ uforudset',ex]].filter(([,v])=>v>0).map(([l,v])=>`${l} ${kr2(v)}`).join(' + ')}${(()=>{const c=credit(p,Y,m);return c>0?` − omregning ${kr2(c)}`:c<0?` + omregning ${kr2(-c)}`:'';})()}</div>
      ${(()=>{const paid=p==='emilie'?st.e:st.l,full=xfer(p,Y,m);
        return paid>0?`<div class="sub" style="color:var(--ink)">I alt ${kr2(full)} − allerede betalt ${kr2(paid)}</div>`:'';})()}</div>
      ${(()=>{const rest=xfer(p,Y,m)-(p==='emilie'?st.e:st.l);return rest>0.005?`<div class="xamt">${kr2(rest)}</div>`:`<div class="xamt" style="color:var(--forbrug);font-size:16px"><i class="ti ti-circle-check"></i> Betalt</div>`;})()}</div>`;};
  const adj=adjOf(Y,m);
  const splitTxt={both:'deles 50/50',emilie:'kun Emilie',leon:'kun Leon'};
  return `<div class="back"><h2>Tjekliste</h2></div>
  <div class="card xfercard">
    <div class="row"><p class="label">Overførsel til ${mName(Y,m)} · ${transferDay(Y,m)}</p>${monthNav()}</div>
    ${xferRow('emilie')}${xferRow('leon')}
    ${st.e+st.l>0?`<div class="row" style="margin-top:10px;font-size:14px"><span>Mangler at overføre i alt</span><b>${kr2(Math.max(0,xferTotal(Y,m)-st.e-st.l))}</b></div>

  </div>
  <div class="card">
    <p class="label">Betalt i ${mName(Y,m)} · fælles poster deles 50/50</p>
    <p class="big" style="font-size:24px">${kr(st.e+st.l)} <span class="label" style="font-size:15px;font-weight:400">af ${kr(st.tot)}</span></p>

      const c=ch[r.key],ns=notesFor(Y,m,r.key);
      if(r.pending)return `<div class="item" data-pendbill="${r.key}"><button class="chk" style="border-style:dashed" aria-label="Indtast regning for ${esc(r.name)}"><i class="ti ti-plus" style="color:var(--muted);font-size:15px"></i></button><div class="nm"><span>${esc(r.name)}</span><div class="sub">Afventer regning · tryk for at indtaste</div></div><span class="pill">Indtast</span></div>`;

        <div class="nm"><span>${esc(r.name)}</span>${ns.length?'<i class="ti ti-message noteicon"></i>':''}
          <div class="sub">${c?`${r.x?dayPrefix(r.x):''}<span class="who-${pCls(c.by)}">Afkrydset af ${esc(c.by)}</span> · ${shortDate(c.at)}${GROUPS[s.g]?.shared||s.g==='ekstra'?' · delt 50/50':''}`:(r.x?.day?`${dayPrefix(r.x).replace(/ · $/,'')}`:'Tryk for at tilføje en note')}</div>

}

function toggleCheck(key){
  const Y=selY(),m=selM(),k=mKey(Y,m);
  state.checks[k]??={};
  const name=rowsFor(Y,m).flatMap(s=>s.rows).find(r=>r.key===key)?.name||'';
  if(state.checks[k][key]){delete state.checks[k][key];addLog(`Fjernede flueben ved ${name} (${mName(Y,m)})`);}
  else{state.checks[k][key]={by:state.me,at:Date.now()};addLog(`Markerede ${name} som betalt (${mName(Y,m)})`);}
  save();const y=window.scrollY;render();window.scrollTo(0,y);
}
function addNote(text,row){
  text=text.trim();if(!text)return false;
  const Y=selY(),m=selM();
  state.notes.push({id:'n'+Date.now(),month:mKey(Y,m),row:row??null,text,by:state.me,at:Date.now()});
  addLog(`Skrev en note${row?'':' til '+mName(Y,m)}: "${text.length>40?text.slice(0,40)+'…':text}"`);
  save();return true;
}
function openRowNote(key,name){
  const Y=selY(),m=selM(),c=(state.checks[mKey(Y,m)]||{})[key];
  sh.innerHTML=`<h3>${esc(name)}</h3>
    <p class="label" style="margin:-8px 0 14px">${MONTHS[m]} ${Y}${c?` · afkrydset af ${esc(c.by)} ${shortDate(c.at)}`:' · ikke afkrydset endnu'}</p>
    ${notesFor(Y,m,key).map(noteHtml).join('')}
    <div class="field" style="margin-top:12px"><label for="rNote">Ny note</label><textarea id="rNote" placeholder="Fx Betales først d. 15., når lønnen er gået ind"></textarea></div>
    <div class="btns"><button class="btn sec" id="rCancel">Luk</button><button class="btn pri" id="rSave">Gem note</button></div>`;
  bg.classList.add('open');
  document.getElementById('rCancel').onclick=closeSheet;
  document.getElementById('rSave').onclick=()=>{if(addNote(document.getElementById('rNote').value,key)){closeSheet();render();toast('Noten er gemt');}};
  sh.querySelectorAll('[data-delnote]').forEach(b=>b.onclick=()=>armed(b,()=>{delNote(b.dataset.delnote);openRowNote(key,name);}));
  setTimeout(()=>document.getElementById('rNote').focus(),50);
}
function openAdjust(a){
  const isNew=!a,Y=a?a.y:selY(),m=a?a.m:selM();
  sh.innerHTML=`<h3>${isNew?'Ny omregning':'Ret omregning'}</h3>
    <p class="label" style="margin:-8px 0 14px">Overførslen til ${mName(Y,m)} · ${transferDay(Y,m)}. Udgifterne ændres ikke, kun hvad I skal overføre.</p>
    <div class="field"><label for="aKind">Type</label><select id="aKind">
      <option value="extra" ${a?.kind!=='short'?'selected':''}>Ekstra på kontoen (trækkes fra overførslen)</option>
      <option value="short" ${a?.kind==='short'?'selected':''}>Mangler på kontoen (lægges til overførslen)</option></select></div>
    <div class="field"><label for="aText">Beskrivelse</label><input id="aText" value="${esc(a?.text||'')}" placeholder="Fx Tilbagebetalt fejloverførsel"></div>
    <div class="field"><label for="aAmt">Beløb</label><input id="aAmt" type="number" inputmode="decimal" step="0.01" value="${a?+a.amount:''}" placeholder="Fx 1.500"></div>
    <div class="field"><label for="aSplit">Fordeling</label><select id="aSplit">
      <option value="both" ${!a||a.split==='both'?'selected':''}>Deles 50/50</option>
      <option value="emilie" ${a?.split==='emilie'?'selected':''}>Kun Emilie</option>
      <option value="leon" ${a?.split==='leon'?'selected':''}>Kun Leon</option></select></div>
    <p class="label err" id="aErr">Indtast et beløb</p>
    <div class="btns">${isNew?'':'<button class="btn del" id="aDel" aria-label="Slet"><i class="ti ti-trash"></i></button>'}
      <button class="btn sec" id="aCancel">Annuller</button><button class="btn pri" id="aSave">Gem</button></div>`;
  bg.classList.add('open');
  const q=id=>document.getElementById(id);
  q('aCancel').onclick=closeSheet;
  q('aAmt').oninput=()=>q('aErr').style.display='none';
  if(q('aDel'))q('aDel').onclick=()=>armed(q('aDel'),()=>{state.adjust=state.adjust.filter(x=>x.id!==a.id);addLog(`Slettede omregning: ${a.text||''} (${kr2(+a.amount)}, ${mName(Y,m)})`);save();closeSheet();render();toast('Slettet');});
  q('aSave').onclick=()=>{
    const amt=parseFloat(q('aAmt').value.replace(',','.'));
    if(!(amt>0)){q('aErr').style.display='block';return;}
    const d={y:Y,m,text:q('aText').value.trim(),amount:amt,kind:q('aKind').value,split:q('aSplit').value,by:state.me,at:Date.now()};
    if(isNew)state.adjust.push({id:'a'+d.at,...d});else Object.assign(a,d);
    addLog(`${isNew?'Tilføjede':'Rettede'} omregning for ${mName(Y,m)}: ${d.text||'uden beskrivelse'} ${d.kind==='short'?'+':'−'}${kr2(amt)}`);
    save();closeSheet();const sy=window.scrollY;render();window.scrollTo(0,sy);toast('Overførslen er regnet om');
  };
}
function delNote(id){
  const n=state.notes.find(x=>x.id===id);if(!n)return;
  state.notes=state.notes.filter(x=>x.id!==id);addLog(`Slettede en note`);save();
  const y=window.scrollY;render();window.scrollTo(0,y);toast('Noten er slettet');
}
/* To-trins sletning i stedet for browserens confirm(), som ikke altid vises */
function armed(btn,fn,label='Slet?'){
  if(btn.dataset.armed){fn();return;}
  btn.dataset.armed='1';const old=btn.innerHTML;
  btn.innerHTML=label;btn.classList.add('armed');
  setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.innerHTML=old;btn.classList.remove('armed');}},3000);
}

function logView(){
  return `<div class="back"><h2>Ændringer</h2></div>
  <div class="card list log">
    ${state.log.length?state.log.slice().reverse().map(l=>`<div class="item">
      <div class="avatar" style="width:32px;height:32px;font-size:13px;background:${l.who==='Leon'?'var(--leon-soft)':'var(--emilie-soft)'};color:${l.who==='Leon'?'var(--leon)':'var(--emilie)'}">${esc(l.who[0])}</div>
      <div class="nm">${esc(l.text)}<div class="sub">${esc(l.who)} · ${when(l.at)}</div></div></div>`).join('')
    :'<p class="empty">Ingen ændringer endnu. Når en af jer retter en post, står det her.</p>'}
  </div>
  <button class="add" data-export style="color:var(--muted)"><i class="ti ti-download"></i>Hent backup af alle data</button>`;
}

/* ---------- interactions ---------- */
function bind(){
  const $$=s=>document.querySelectorAll('#view '+s);
  $$('[data-sel]').forEach(b=>b.onclick=()=>{sel=+b.dataset.sel;render();});
  $$('[data-m]').forEach(b=>b.onclick=()=>{sel=Math.min(MAX_IDX,Math.max(START_IDX,sel+ +b.dataset.m));render();});
  $$('[data-open]').forEach(b=>b.onclick=()=>go('p/'+b.dataset.open));
  $$('[data-back]').forEach(b=>b.onclick=()=>history.length>1?history.back():go('home'));
  $$('[data-edit]').forEach(b=>b.onclick=()=>{const x=state.items.find(i=>i.id===b.dataset.edit);x.v?openBill(x,selY(),selM()):openSheet(x);});
  $$('[data-bill]').forEach(b=>b.onclick=()=>openBill(state.items.find(i=>i.id===b.dataset.bill),+b.dataset.by,+b.dataset.bm));
  $$('[data-new]').forEach(b=>b.onclick=()=>openSheet(null,b.dataset.new));
  $$('[data-extra]').forEach(b=>b.onclick=()=>openExtra(state.extras.find(e=>e.id===b.dataset.extra)));
  $$('[data-newextra]').forEach(b=>b.onclick=()=>openExtra(null));
  $$('[data-pick]').forEach(b=>b.onclick=()=>{sel=+b.dataset.pick;go('home');});
  $$('[data-pendbill]').forEach(b=>b.onclick=()=>openBill(state.items.find(i=>i.id===b.dataset.pendbill),selY(),selM(),true));
  $$('[data-newadj]').forEach(b=>b.onclick=()=>openAdjust(null));
  $$('[data-adj]').forEach(b=>b.onclick=()=>openAdjust(state.adjust.find(a=>a.id===b.dataset.adj)));
  $$('[data-chk]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();toggleCheck(b.dataset.chk);});
  $$('[data-row]').forEach(b=>b.onclick=ev=>{if(ev.target.closest('[data-delnote]'))return;openRowNote(b.dataset.row,b.dataset.rowname);});
  $$('[data-delnote]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();armed(b,()=>delNote(b.dataset.delnote));});
  $$('[data-addnote]').forEach(b=>b.onclick=()=>{if(addNote(document.getElementById('mNote').value,null)){render();toast('Noten er gemt');}});
  $$('#mNote').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'&&addNote(i.value,null)){render();toast('Noten er gemt');}});
  $$('[data-go2]').forEach(b=>b.onclick=()=>go(b.dataset.go2));
  $$('[data-year]').forEach(b=>b.onclick=()=>{yearView=+b.dataset.year;render();});
  $$('[data-logout]').forEach(b=>b.onclick=()=>armed(b,logout,'Log ud?'));
  $$('[data-export]').forEach(b=>b.onclick=exportData);
}

const bg=document.getElementById('sheetBg'),sh=document.getElementById('sheet');
bg.onclick=e=>{if(e.target===bg)closeSheet();};
function closeSheet(){bg.classList.remove('open');}

function openBill(x,Y,m,fromCheck){
  if(!active(Y,m)){toast('Måneden ligger før budgettets start');return;}
  const v=val(x,Y,m),pay=idx(Y,m),c=x.cover?.[Y]?.[m]??pay-1;
  const opts=[];for(let i=pay;i>=Math.max(pay-12,START_IDX-1);i--)opts.push(i);
  sh.innerHTML=`
    <h3>${esc(x.name)}</h3>
    <p class="label" style="margin:-8px 0 16px">Trækkes i ${mName(Y,m)} · overføres ${transferDay(Y,m)}</p>
    <div class="field"><label for="bAmt">Regningens beløb</label><input id="bAmt" type="number" inputmode="decimal" step="0.01" value="${has(v)?+v:''}" placeholder="Fx 1.081,90"></div>
    <div class="field"><label for="bDay">Trækkes normalt fra kontoen</label>${daySelect('bDay',x.day)}</div>
    <div class="field"><label for="bCov">Regningen dækker</label><select id="bCov">${opts.map(i=>{const f=fromIdx(i);return `<option value="${i}" ${i===c?'selected':''}>${MONTHS[f.m]} ${f.Y}</option>`;}).join('')}</select></div>
    ${fromCheck?`<label style="display:flex;align-items:center;gap:10px;font-size:15px;margin:4px 0 8px;cursor:pointer"><input type="checkbox" id="bPaid" checked style="width:22px;height:22px;accent-color:${state.me==='Leon'?'var(--leon)':'var(--emilie)'}"> Kryds af som betalt</label>`:''}
    <p class="label err" id="bErr">Indtast et beløb</p>
    <div class="btns">
      ${has(v)?'<button class="btn del" id="bDel" aria-label="Fjern beløb"><i class="ti ti-trash"></i></button>':''}
      <button class="btn sec" id="bCancel">Annuller</button>
      <button class="btn pri" id="bSave">Gem</button>
    </div>`;
  bg.classList.add('open');
  const q=id=>document.getElementById(id);
  const ensure=()=>{x.years[Y]??=all(null);x.cover??={};x.cover[Y]??=all(null);};
  q('bCancel').onclick=closeSheet;
  q('bAmt').oninput=()=>q('bErr').style.display='none';
  setTimeout(()=>q('bAmt').focus(),250);
  if(q('bDel'))q('bDel').onclick=()=>{ensure();x.years[Y][m]=null;x.cover[Y][m]=null;addLog(`Fjernede ${x.name} for ${mName(Y,m)}`);save();closeSheet();render();toast('Beløbet er fjernet');};
  q('bSave').onclick=()=>{
    const raw=q('bAmt').value.replace(',','.');
    if(raw===''||isNaN(parseFloat(raw))){q('bErr').style.display='block';return;}
    ensure();
    const amt=Math.max(0,parseFloat(raw)),cov=+q('bCov').value;
    x.years[Y][m]=amt;x.cover[Y][m]=cov;x.day=readDay(q('bDay').value);x.by=state.me;x.at=Date.now();
    addLog(`${x.name}: ${idxName(cov)}-regning på ${kr2(amt)} overføres i ${mName(Y,m)}`);
    const paid=q('bPaid')?.checked;
    if(paid){const k=mKey(Y,m);state.checks[k]??={};state.checks[k][x.id]={by:state.me,at:Date.now()};addLog(`Markerede ${x.name} som betalt (${mName(Y,m)})`);}
    save();closeSheet();const sy=window.scrollY;render();if(fromCheck)window.scrollTo(0,sy);toast(paid?'Gemt og markeret som betalt':'Regningen er gemt');
  };
}

function openSheet(x,g){
  const isNew=!x;const Y=selY();
  if(isNew&&GROUPS[g].variable){
    sh.innerHTML=`<h3>Ny forbrugspost</h3>
      <div class="field"><label for="vName">Navn</label><input id="vName" placeholder="Fx Varme"></div>
      <p class="label">Posten har intet fast beløb. I taster regningen ind hver gang, den kommer.</p>
      <p class="label err" id="vErr">Giv posten et navn</p>
      <div class="btns"><button class="btn sec" id="vCancel">Annuller</button><button class="btn pri" id="vSave">Opret</button></div>`;
    bg.classList.add('open');
    document.getElementById('vCancel').onclick=closeSheet;
    document.getElementById('vSave').onclick=()=>{
      const name=document.getElementById('vName').value.trim();
      if(!name){document.getElementById('vErr').style.display='block';return;}
      state.items.push({g,name,icon:'ti-receipt',v:true,years:{},cover:{},id:'n'+Date.now(),by:state.me,at:Date.now()});
      addLog(`Oprettede forbrugsposten ${name}`);save();closeSheet();render();toast('Oprettet');
    };
    return;
  }
  const a=x?fixedArr(x,Y):all(0);
  sh.innerHTML=`
    <h3>${isNew?'Ny post · '+GROUPS[g].name:'Ret post'}</h3>
    <div class="field"><label for="fName">Navn</label><input id="fName" value="${esc(x?x.name:'')}" placeholder="Fx Tandlægeforsikring"></div>
    <div class="field"><label for="fAll">Samme beløb hver måned</label>
      <div class="inline"><input id="fAll" type="number" inputmode="decimal" placeholder="${irregular(a)?'Forskellige beløb':(+a[0]||0)}"><button id="fApply">Brug</button></div></div>
    <div class="field"><label>Beløb pr. måned i ${Y}</label>
      <div class="mgrid">${MONTHS.map((n,m)=>`<div><span>${n}</span><input type="number" inputmode="decimal" step="0.01" data-mi="${m}" value="${+a[m]||''}" placeholder="0" ${active(Y,m)?'':'disabled title="Før budgettets start"'}></div>`).join('')}</div></div>
    <div class="field"><label for="fDay">Trækkes fra kontoen</label>${daySelect('fDay',x?.day)}</div>
    <p class="label">Ændringer gælder for ${Y} og fortsætter i de næste år, indtil I retter dem igen.</p>
    ${x&&x.by?`<p class="label" style="margin-top:6px">Sidst rettet af ${esc(x.by)} · ${when(x.at)}</p>`:''}
    <p class="label err" id="fErr"></p>
    <div class="btns">
      ${isNew?'':'<button class="btn del" id="fDel" aria-label="Slet"><i class="ti ti-trash"></i></button>'}
      <button class="btn sec" id="fCancel">Annuller</button>
      <button class="btn pri" id="fSave">Gem</button>
    </div>`;
  bg.classList.add('open');
  const q=id=>document.getElementById(id);
  q('fApply').onclick=()=>{const v=q('fAll').value;if(v==='')return;sh.querySelectorAll('[data-mi]').forEach(i=>i.value=v);};
  q('fCancel').onclick=closeSheet;
  if(q('fDel'))q('fDel').onclick=()=>{
    armed(q('fDel'),()=>{
    state.items=state.items.filter(i=>i.id!==x.id);
    addLog(`Slettede ${x.name} (${GROUPS[x.g].name})`);save();closeSheet();render();toast('Posten er slettet');
  });};
  q('fSave').onclick=()=>{
    const name=q('fName').value.trim();
    if(!name){q('fErr').textContent='Giv posten et navn';q('fErr').style.display='block';return;}
    const na=[...sh.querySelectorAll('[data-mi]')].map(i=>Math.max(0,parseFloat(i.value.replace(',','.'))||0));
    const now=Date.now(),day=readDay(q('fDay').value);
    if(isNew){
      state.items.push({g,name,icon:'ti-receipt',years:{[Y]:na},day,id:'n'+now,by:state.me,at:now});
      addLog(`Tilføjede ${name} (${GROUPS[g].name})`);
    }else{
      const changes=[];
      if(name!==x.name)changes.push(`omdøbte "${x.name}" til "${name}"`);
      if((day??null)!==(x.day??null))changes.push(`${name}: trækkes ${day?dayTxt({day}):'uden fast dato'}`);
      if(na.some((v,i)=>v!==(+a[i]||0))){
        changes.push(!irregular(na)&&!irregular(a)?`${name}: ${kr2(+a[0]||0)} → ${kr2(na[0])} pr. md`:`${name}: nye månedsbeløb for ${Y}`);
      }
      if(!changes.length){closeSheet();return;}
      x.name=name;x.years[Y]=na;x.day=day;x.by=state.me;x.at=now;
      addLog(changes.join(', ').replace(/^./,c=>c.toUpperCase()));
    }
    save();closeSheet();render();toast('Gemt');
  };
}
function addLog(text){const at=Date.now();state.log.push({id:'l'+at+Math.random().toString(36).slice(2,6),who:state.me,at,text});if(state.log.length>300)state.log.shift();}
function toast(t,ms=1800){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),ms);}
</script>
